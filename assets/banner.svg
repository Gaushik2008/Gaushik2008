<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Gaushik Kumar Ganesan: code that sees ahead">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1a"/>
      <stop offset="0.55" stop-color="#101735"/>
      <stop offset="1" stop-color="#1a1040"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.15" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.9" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#e879f9" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#e879f9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glowA)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glowB)"/>

  <!-- floating nodes -->
  <g fill="#22d3ee" fill-opacity="0.7">
    <circle cx="90" cy="60" r="3"><animate attributeName="cy" values="60;48;60" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="1090" cy="80" r="3" fill="#e879f9"><animate attributeName="cy" values="80;94;80" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="1010" cy="250" r="2.5" fill="#818cf8"><animate attributeName="cy" values="250;236;250" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="258" r="2.5"><animate attributeName="cy" values="258;270;258" dur="8s" repeatCount="indefinite"/></circle>
  </g>
  <g stroke="#818cf8" stroke-opacity="0.25" stroke-width="1">
    <line x1="90" y1="60" x2="150" y2="258"/>
    <line x1="1090" y1="80" x2="1010" y2="250"/>
  </g>

  <!-- window chrome -->
  <g transform="translate(36 30)">
    <circle cx="0" cy="0" r="6" fill="#ff5f57"/>
    <circle cx="20" cy="0" r="6" fill="#febc2e"/>
    <circle cx="40" cy="0" r="6" fill="#28c840"/>
  </g>
  <text x="600" y="34" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="13" fill="#94a3b8">gaushik@portfolio: ~</text>

  <text x="70" y="108" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="20" fill="#22d3ee">$ <tspan fill="#cbd5e1">whoami</tspan></text>

  <text x="70" y="190" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="68" font-weight="800" fill="url(#accent)">Gaushik Kumar Ganesan</text>

  <text x="72" y="236" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="24" fill="#e2e8f0">Code that sees ahead<tspan fill="#e879f9">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>_</tspan></text>

  <text x="72" y="276" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="16" fill="#94a3b8">AI  ·  Agents  ·  Cloud  ·  Software</text>

  <rect x="0.5" y="0.5" width="1199" height="319" rx="18" fill="none" stroke="url(#accent)" stroke-opacity="0.55"/>
</svg>
